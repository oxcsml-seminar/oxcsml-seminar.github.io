title: >-
  Fast Best-in-Class Regret via Pessimistic Policy Learning
abstract: >-
  We study best-in-class policy learning in contextual bandits, where
  the goal is to compete with the best policy in a given class, without
  assuming a correctly specified reward model. A central challenge in
  this agnostic setting is that policy evaluation from bandit feedback
  can suffer from large, policy-dependent variance. In this talk, I
  will discuss how pessimistic policy learning can exploit the
  progressively improving quality of adaptively collected data to
  achieve fast regret rates. The key structural ingredient is a
  policy-level Hölderian error bound linking excess risk to the variance
  of importance weights. I will first introduce Sequential
  Counterfactual Risk Minimization, which leverages repeated policy
  deployments in a batched setting, before turning to Online Pessimistic
  Policy Learning, which extends these ideas to fully online contextual
  bandits with rich policy classes. The latter approach constructs
  pessimistic upper confidence bounds on policy risk using clipped
  importance-weighted estimates and variance-sensitive penalties.
  A novel self-normalized martingale concentration argument provides
  uniform confidence guarantees, leading to fast best-in-class regret
  bounds, including polylogarithmic rates under suitable structural
  conditions.
